name: توليد حلقات ميراي سند

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "أسماء الحلقات مفصولة بمسافة (فارغ = كل الحلقات)"
        required: false
        default: ""
  push:
    paths:
      - series.toml
      - mirai.py
      - assets/**
      - .github/workflows/generate.yml

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      # نسخة جاهزة من ffmpeg (ثوانٍ بدل ~15 دقيقة عبر apt-get)
      - name: تثبيت ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: تثبيت MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python mirai.py setup

      - name: توليد الحلقات
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          EPISODES: ${{ github.event.inputs.episodes }}
        run: python mirai.py generate $EPISODES

      - name: رفع الفيديوهات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirai-sanad-videos
          path: output/*.mp4
          if-no-files-found: warn
