name: توليد حلقات ميراي سند

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "أسماء الحلقات مفصولة بمسافة (فارغ = كل الحلقات)"
        required: false
        default: ""
  push:
    paths:
      - series.toml
      - mirai.py
      - sanad_mirai.py
      - dialogues/**
      - assets/**
      - .github/workflows/generate.yml

permissions:
  contents: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      # نسخة جاهزة من ffmpeg (ثوانٍ بدل ~15 دقيقة عبر apt-get)
      - name: تثبيت ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: تثبيت MoneyPrinterTurbo
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python mirai.py setup

      # الحلقات الحوارية (ميراي وسند): رسوم + صوتان من edge-tts، وPiper احتياطاً
      - name: توليد حلقات ميراي وسند الحوارية
        run: |
          pip install -q edge-tts pillow piper-tts
          python -c "from PIL import features; assert features.check('raqm')" \
            || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfribidi0 libraqm0)
          python -m piper.download_voices --data-dir vendor/piper ar_JO-kareem-medium
          python sanad_mirai.py

      - name: توليد الحلقات
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          EPISODES: ${{ github.event.inputs.episodes }}
        run: python mirai.py generate $EPISODES

      - name: رفع الفيديوهات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirai-sanad-videos
          path: output/*.mp4
          if-no-files-found: warn

      # نشر الفيديوهات في فرع videos (نسخة واحدة تُستبدل كل مرة) ليستلمها Claude ويرسلها مباشرة
      - name: نشر الفيديوهات في فرع videos
        if: success()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cd output
          git init -q -b videos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.mp4
          git commit -q -m "Videos from run $RUN_ID"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" videos
