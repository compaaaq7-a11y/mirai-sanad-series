name: حذف مقاطع محددة من يوتيوب (بطلب صاحب القناة)

on:
  push:
    paths:
      - publish/delete.json

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python blender/youtube_delete.py publish/delete.json
