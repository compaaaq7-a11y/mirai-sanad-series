<div id="stage"></div>

<script>
(function(){
const TL = window.TIMELINE;
const W = TL.width||1080, H = TL.height||1920;
const stage = document.getElementById('stage');
const sc = Math.min(W/1080, H/1920);
stage.style.transform = `scale(${W/1080},${H/1920})`;
document.body.style.width = W+'px'; document.body.style.height = H+'px';

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeOutBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rng(seed){let s=seed>>>0||1;return()=>((s=Math.imul(s^(s>>>15),2246822519)+0x9e3779b9>>>0)%100000)/100000}

/* سمات الألوان حسب نوع الإعلان: a1 لون التمييز، a2 ظله، a3 خلفية الأشعة، glow توهج الخلفية الداكنة، cream الخلفية الفاتحة */
const THEMES={
  classic:{a1:'#E3121F',a2:'#A8000F',a3:'#C4041A',glow:'#6a0b10',cream:'#F1ECE4'},
  food:   {a1:'#FF7A00',a2:'#B34700',a3:'#E86A00',glow:'#6b3205',cream:'#FFF3E2'},
  luxury: {a1:'#E2B84E',a2:'#8A6418',a3:'#B8892B',glow:'#4a3510',cream:'#F4EEE2'},
  fashion:{a1:'#FF3D8B',a2:'#A3104F',a3:'#E0206F',glow:'#5e0a32',cream:'#FFF0F6'},
  nature: {a1:'#22B573',a2:'#0E6B40',a3:'#18965E',glow:'#0b3d24',cream:'#EEF8F0'},

function extrude(color, px){
  const [a,b]=EXT[color]||EXT.white, n=Math.max(6,Math.round(px/11)), out=[];
  for(let i=1;i<=n;i++){ out.push(`0 ${i}px 0 ${mix(a,b,i/n)}`); }
  out.push(`0 ${n+6}px 18px rgba(0,0,0,.55)`,`0 ${n+30}px 50px rgba(0,0,0,.35)`);
  return out.join(',');
}

/* ---------- رسم لحظة t ---------- */
let shown=new Set();
function seek(t){
  let i=TL.scenes.findIndex(s=>t>=s.start&&t<s.end);
  if(i<0) i = t<TL.scenes[0].start?0:TL.scenes.length-1;
  const s=TL.scenes[i], want=new Set([i]);
  // تلاشٍ متقاطع: المشهد السابق يبقى تحت الجديد خلال xfade ثانية
  const xf=s.xfade||0, inX=xf>0&&i>0&&(t-s.start)<xf;
  if(inX) want.add(i-1);
  shown.forEach(k=>{ if(!want.has(k)) built[k].root.style.display='none'; });
  const waits=[];
  if(inX){ waits.push(draw(i-1,t)); const P=built[i-1].root; P.style.display='block'; P.style.zIndex=0; P.style.opacity=1; }
  waits.push(draw(i,t)); const C=built[i].root; C.style.display='block'; C.style.zIndex=1;
  C.style.opacity = inX ? easeOutCubic(clamp((t-s.start)/xf)) : 1;
  shown=want;
  const w=waits.filter(Boolean); return w.length?Promise.all(w):undefined;
}
function draw(i,t){
  const R=build(i), s=R.s;
  const lt=t-s.start, dur=s.end-s.start, prog=clamp(lt/dur);

  // دخول المشهد: ضربة زووم + ضبابية حركة (whip)
  const ein=s.soft?1:clamp(lt/0.16);
  let camS = 1 + (s.push!=null?s.push:0.07)*easeOutCubic(prog) + 0.12*(1-easeOutCubic(ein));
  let camY = 70*(1-easeOutCubic(ein)), camX=0, camR=(s.tilt||0)*prog;
  if(R.shake!=null){const d=t-R.shake; if(d>=0&&d<.22){const k=(1-d/.22)*14;camX=Math.sin(d*90)*k;camY+=Math.cos(d*70)*k;}}
  R.cam.style.transform=`translate(${camX}px,${camY}px) scale(${camS}) rotate(${camR}deg)`;
  R.cam.style.filter = ein<1?`blur(${(1-ein)*10}px)`:'none';
  R.flash.style.opacity = (s.soft||s.flash===false)?0:(0.55*(1-clamp(lt/0.09)));

  // الكلمات: تظهر لحظة نطقها بضربة (scale + blur + overshoot)
  R.words.forEach(({e,w},k)=>{
    const d=t-w.t;
    if(d<0){e.style.opacity=0;return;}
    const g=s.gentle||TL.gentle;   // دخول هادئ للمواضيع العاطفية
    const p=clamp(d/(g?0.5:0.2)), eb=g?easeOutCubic(p):easeOutBack(p);
    const sc = g?1.12-0.12*eb:1.75-0.75*eb, bl=(g?8:12)*(1-easeOutCubic(p));
    const ty = (g?30:-50)*(1-eb) + Math.sin((t+k)*1.3)*(g?1.5:3);
    e.style.opacity=clamp(d/(g?0.35:0.06));
    e.style.transform=`translateY(${ty}px) scale(${sc})`;
    e.style.filter=bl>.3?`blur(${bl}px)`:'none';
  });

  // الخلفيات المتحركة
  if(R.rays) R.rays.style.transform=`rotate(${t*4}deg)`;
  if(R.photo){ // حركة الكاميرا على الصورة: push pull left right up down still (أو كين بيرنز تلقائي)
    const a=s.kb_start??s.start, b=s.kb_end??s.end, q=easeInOut(clamp((t-a)/(b-a)));
    const mv=s.move||['push','left','push','right','up'][(i*37)%5];
    // زوم خفيف (حتى 8%) حتى لا تفقد الصورة دقتها
    let sc=1.0, dx=0, dy=0;
    if(mv==='push') sc=1.0+0.08*q; else if(mv==='pull') sc=1.08-0.08*q;
    else if(mv==='still') sc=1.0+0.025*q;
    else { sc=1.06; const m=28*(q-0.5)*2; if(mv==='left')dx=m; if(mv==='right')dx=-m; if(mv==='up')dy=m; if(mv==='down')dy=-m; }
    R.photo.style.transformOrigin=s.focus||'50% 50%';
    R.photo.style.transform=`translate(${dx}px,${dy}px) scale(${sc})`; }
  // مقطع فيديو: فريم مستخرج مسبقاً لكل لحظة (render.mjs يملأ s.frames)
  let pend=null;
  if(R.vimg&&s.frames){ const F=s.frames, lt2=(t-s.start)*(s.video_rate||1)+(s.video_from||0);
    let k=Math.floor(lt2*F.fps); k = s.video_loop===false ? Math.min(k,F.count-1) : ((k%F.count)+F.count)%F.count;
    if(k!==R.vlast){ R.vlast=k; R.vimg.src=F.dir+'/'+String(k+1).padStart(5,'0')+'.jpg'; pend=R.vimg.decode().catch(()=>{}); } }
  if(R.bubble){const d=t-R.bubble.at,p=clamp(d/0.28),eb=easeOutBack(p);
    R.bubble.e.style.opacity=d<0?0:1; R.bubble.e.style.transform=`scale(${(d<0?0:0.2+0.8*eb)*R.bubble.k}) rotate(${R.bubble.rot+Math.sin(t*9)*2}deg)`;}
  if(R.stars) R.stars.forEach(st=>{const d=t-st.at; if(d<0){st.e.style.opacity=0;return;}
    const tw=0.8+0.2*Math.sin(t*7+st.ph), p=easeOutBack(clamp(d/0.3));
    st.e.style.opacity=clamp(d/0.1)*tw; st.e.style.transform=`translate(${st.x}px,${st.y-30*d}px) scale(${st.sz*p}) rotate(${t*90+st.ph*40}deg)`;});
  if(R.conf) R.conf.forEach(c=>{const d=t-c.at; if(d<0){c.e.style.opacity=0;return;}
    const y=-60+c.v*d, x=c.x+Math.sin(d*3+c.ph)*c.sw; c.e.style.opacity=y>1950?0:1;
    c.e.style.transform=`translate(${x}px,${y}px) rotate(${c.rot*d}deg) rotateX(${d*400+c.ph*60}deg)`;});
  R.stk&&R.stk.forEach(o=>{const d=t-o.at; if(d<0){o.e.style.opacity=0;return;} const p=easeOutBack(clamp(d/0.35));
    o.e.style.opacity=clamp(d/0.08); o.e.style.transform=`translate(${o.x}px,${o.y+Math.sin(t*1.6+o.ph)*10}px) translate(-50%,-50%) rotate(${o.rot*(1+0.6*(1-p))}deg) scale(${0.3+0.7*p})`;});
  R.pol&&R.pol.forEach(o=>{const d=t-o.at; if(d<0){o.e.style.opacity=0;return;} const p=easeOutCubic(clamp(d/0.35));
    o.e.style.opacity=clamp(d/0.1); o.e.style.transform=`translate(${o.x}px,${o.y-180*(1-p)}px) rotate(${o.rot+(1-p)*25}deg) scale(${1.25-0.25*p})`;});
  if(R.speed){const d=t-R.speed.at; R.speed.e.style.opacity=d<0?0:(0.6+0.25*Math.sin(t*40)); R.speed.e.style.transform=`rotate(${Math.floor(t*12)*7}deg)`;}
  // تلاشٍ إلى الأسود في نهاية المشهد: fade=out
  if(R.fadeEl){ const f=s.fade_len||1.4; R.fadeEl.style.opacity=clamp((t-(s.end-f))/f); }
  R.embers.forEach(m=>{const y=((m.y - t*m.v)%1920+1920)%1920;
    m.e.style.transform=`translate(${m.x+Math.sin(t*1.5+m.x)*20}px,${y}px) scale(${m.sz})`;m.e.style.opacity=m.a*(0.6+0.4*Math.sin(t*6+m.x));});
  if(R.tc){const f=Math.floor(t*30)%30, ss=Math.floor(t); R.tc.textContent=`00:00:${String(ss).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
    R.recDot.style.opacity=(Math.floor(t*2)%2)?.25:1;}

  // المؤثرات
  if(R.ring){const d=t-R.ring.at;const p=clamp(d/0.7);R.ring.e.style.opacity=d<0?0:(1-p)*(d<.05?d/.05:1);
    R.ring.e.style.transform=`scale(${0.5+1.1*easeOutCubic(p)})`;}
  R.sparks.forEach(sp=>{const d=t-sp.at; if(d<0||d>.9){sp.e.style.opacity=0;return;}
    const x=sp.cx+Math.cos(sp.ang)*sp.sp*d, y=sp.cy+Math.sin(sp.ang)*sp.sp*d+900*d*d;
    sp.e.style.opacity=1-d/.9; sp.e.style.transform=`translate(${x}px,${y}px) rotate(${sp.ang*57.3+90}deg)`;});
  if(R.slash){const d=t-R.slash.at;const p=clamp(d/0.25);R.slash.e.style.opacity=d<0?0:(d<.5?1:clamp(1-(d-.5)/.3));
    R.slash.e.style.transform=`scaleX(${easeOutCubic(p)}) rotate(-4deg)`;}

  // العناصر
  const P=R.prop;
  if(P){
    const pin=P.p.at!=null?P.p.at:(s.soft?s.start-1:s.start);
    const d=t-pin, p=clamp(d/0.35), eb=easeOutBack(p);
    P.e.style.opacity=clamp(d/0.12);
    P.e.style.transform=`translateY(${(1-eb)*260}px) rotateX(${(1-eb)*25}deg) scale(${0.9+0.1*eb})`;
    if(P.typed){const txt=P.p.text||'',a=P.p.type_from??pin+.2,b=P.p.type_to??(s.end-.2);
      const n=Math.round(txt.length*clamp((t-a)/Math.max(.1,b-a)));P.typed.textContent=txt.slice(0,n);
      P.cur.style.opacity=(Math.floor(t*3)%2)?0:1;
      if(P.p.reply){P.reply.textContent=t>=(P.p.reply_at??s.end-.6)?P.p.reply:'';}}
    if(P.ctext){const txt=P.p.comment||'',a=P.p.comment_at??s.start+.3;
      P.ctext.textContent=t<a?'أضف تعليق...':txt.slice(0,Math.round(txt.length*clamp((t-a)/.4)));
      P.ctext.style.fontWeight=t<a?500:800;}
    if(P.timerEl&&P.p.countdown){const tot=+P.p.countdown,left=Math.max(0,tot*(1-clamp((t-pin)/Math.max(.1,s.end-pin))));
      const m=Math.floor(left/60),sec=Math.floor(left%60);P.timerEl.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
    if(P.fpClip){const q=easeOutCubic(clamp((t-pin-0.2)/Math.max(0.4,(s.end-pin)*0.7)));
      P.fpClip.setAttribute('r',(10+q*250).toFixed(1)); P.e.style.filter=`brightness(${0.9+0.25*Math.sin(t*3)})`;}
    if(P.hgTop){const q=clamp((t-pin-0.2)/Math.max(0.4,(s.end-pin)-0.4));
      const topY=60+q*185; P.hgTop.setAttribute('y',topY.toFixed(1)); P.hgTop.setAttribute('height',(250-topY).toFixed(1));
      const h=8+q*140; P.hgBot.setAttribute('d',`M50 450 L250 450 L250 ${450-h*0.35} Q150 ${450-h*1.25} 50 ${450-h*0.35} Z`);
      P.hgStream.style.opacity=q<1?0.9:0; P.hgStream.setAttribute('height',(205-h*0.9).toFixed(1));}
    if(P.bubbles){const n=P.bubbles.length, span=Math.max(0.5,(s.end-pin)-0.6);
      P.e.style.opacity=1; P.e.style.transform='none';
      P.bubbles.forEach((b,k)=>{const d=t-(pin+0.2+k*span/n),p=easeOutBack(clamp(d/0.3));
        b.style.opacity=d<0?0:clamp(d/0.08); b.style.transform=`translateY(${(1-p)*40}px) scale(${0.6+0.4*p})`;
        b.style.transformOrigin=(k%2?'100%':'0%')+' 100%';});}
    if(P.cards){P.cards.forEach((c,k)=>{const d2=t-(pin+k*.12),p2=easeOutBack(clamp(d2/.3));
      c.style.opacity=clamp(d2/.08);c.style.transform=`translateY(${(1-p2)*200}px) rotateY(${(k-1.5)*-8}deg)`;});}
  }
  return pend;
}
window.seek=seek;
// انتظار الخطوط وكل صور الخلفيات قبل أول فريم
const imgs=[...new Set(TL.scenes.flatMap(s=>[s.image,...(s.stickers||[]),...(s.photos||[]),s.prop&&s.prop.image].filter(Boolean)))].map(u=>{const im=new Image();im.src=u;return im.decode().catch(()=>console.error('image failed: '+u));});
window.engineReady=Promise.all([document.fonts.ready,...imgs]).then(()=>{seek(0);return true;});

if(new URLSearchParams(location.search).has('preview')){
  const t0=performance.now(); const loop=()=>{seek(((performance.now()-t0)/1000)%TL.duration);requestAnimationFrame(loop)};
  window.engineReady.then(loop);
}
})();
</script>
