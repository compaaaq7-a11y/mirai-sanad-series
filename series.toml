# =============================================================================
# سلسلة ميراي سند — ملف الحلقات
# =============================================================================
# عدّل هذا الملف فقط لإضافة حلقات أو تغيير الإعدادات، ثم شغّل:
#   python3 mirai.py generate
#
# الحلقات الموجودة أدناه أمثلة جاهزة يمكنك استبدالها بنصوصك.

[series]
title = "ميراي سند"

# إعدادات افتراضية لكل الحلقات (أي حلقة تستطيع تجاوزها بنفس الاسم)
[defaults]
video_language = "ar"
video_aspect = "9:16"                 # 9:16 عمودي (تيك توك/ريلز/شورتس) أو 16:9 يوتيوب
voice_name = "ar-SA-HamedNeural-Male" # أصوات أخرى: ar-SA-ZariyahNeural-Female, ar-EG-ShakirNeural-Male, ar-EG-SalmaNeural-Female, ar-SY-AmanyNeural-Female, ar-LB-LaylaNeural-Female, ar-JO-SanaNeural-Female
voice_rate = 1.0
bgm_type = "random"                   # موسيقى خلفية عشوائية من مكتبة الأداة، أو "none"
bgm_volume = 0.15
subtitle_enabled = true
subtitle_position = "bottom"
font_name = "Cairo-Regular.ttf"        # خط عربي يُثبَّت تلقائياً
font_size = 60
text_fore_color = "#FFFFFF"
stroke_color = "#000000"
stroke_width = 1.5
video_clip_duration = 4
video_transition_mode = "FadeIn"       # None, FadeIn, FadeOut, SlideIn, SlideOut, ZoomIn, ZoomOut, Shuffle

# -----------------------------------------------------------------------------
# الحلقات
# id: اسم ملف الفيديو الناتج (output/<id>.mp4)
# script: نص الحلقة الذي سيُقرأ ويُكتب كترجمة
# terms: كلمات بحث إنجليزية للقطات الفيديو (Pixabay أو Pexels) (مفصولة بفواصل)
# -----------------------------------------------------------------------------

[[episodes]]
id = "ep01-intro"
title = "ما هي ميراي سند؟"
terms = "future city, sunrise, technology, people walking"
script = """
ميراي كلمة يابانية تعني المستقبل، وسند كلمة عربية تعني من يقف معك.
ميراي سند سلسلة قصيرة تقف معك وأنت تبني مستقبلك.
في كل حلقة فكرة واحدة عملية تستطيع تطبيقها اليوم.
تابعنا، وابدأ رحلتك نحو الغد بخطوة صغيرة.
"""

[[episodes]]
id = "ep02-ai-tools"
title = "الذكاء الاصطناعي مساعدك الجديد"
terms = "artificial intelligence, laptop, robot, coding"
script = """
الذكاء الاصطناعي لم يعد خيالاً علمياً، بل أداة في جيبك.
يمكنه أن يلخّص لك كتاباً، أو يكتب مسودة رسالة، أو يشرح لك درساً صعباً.
السر ليس في الأداة، بل في السؤال الجيد.
اكتب طلبك بوضوح، واذكر الهدف، وراجع النتيجة دائماً بعقلك.
"""

[[episodes]]
id = "ep03-learning"
title = "تعلّم مهارة كل شهر"
terms = "studying, books, online learning, notebook"
script = """
أسرع طريقة لتغيير مستقبلك أن تتعلم مهارة جديدة كل شهر.
اختر مهارة واحدة، وخصص لها عشرين دقيقة يومياً.
بعد عام ستملك اثنتي عشرة مهارة جديدة.
القليل الدائم خير من الكثير المنقطع.
"""

[[episodes]]
id = "ep04-time"
title = "وقتك رأس مالك"
terms = "clock, morning routine, calendar, focus"
script = """
الوقت هو الشيء الوحيد الذي لا يمكن استرجاعه.
ابدأ يومك بأهم مهمة قبل أن تفتح هاتفك.
قسّم عملك إلى فترات قصيرة مركّزة، وخذ استراحة بينها.
من يملك وقته، يملك مستقبله.
"""

[[episodes]]
id = "ep05-together"
title = "لا أحد ينجح وحده"
terms = "teamwork, friends, community, handshake"
script = """
خلف كل ناجح أشخاص كانوا سنداً له.
ابحث عمّن يشاركك الطموح، وكن أنت سنداً لغيرك.
اسأل، وشارك ما تعرف، واحتفل بنجاح الآخرين.
فالمستقبل نبنيه معاً.
هذه كانت ميراي سند، نلقاكم في الحلقة القادمة.
"""

[[episodes]]
id = "ep06-baby-bird"
title = "سند وميراي والفرخ الصغير"
terms = "baby bird, bird nest, sunny garden, orange cat, ball of yarn, children playing"
voice_name = "ar-SY-AmanyNeural-Female"    # صوت نسائي شامي دافئ للحكاية
voice_rate = 0.9                            # إيقاع هادئ
bgm_volume = 0.1                            # موسيقى خافتة تحت التعليق
script = """
سمع سند وميراي زقزقةً تحت الشجرة.
كان فرخٌ صغير قد سقط من عشّه، وقطةٌ تستعدّ للانقضاض عليه!
دحرجت ميراي كرة الصوف، فركضت القطة خلفها.
وحمل سند الفرخ برفق وأعاده إلى عشّه.
وحين عادت أمّه، زقزق كأنّه يقول لهما: شكرًا!
"""
